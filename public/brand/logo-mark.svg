<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123a70"/>
      <stop offset="1" stop-color="#0b2f5c"/>
    </linearGradient>
    <linearGradient id="path" x1="55" y1="150" x2="150" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8c52"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- dotted route -->
  <path d="M 56 148 C 56 110, 90 122, 100 100 C 110 78, 96 66, 118 56"
        fill="none" stroke="#4f8bea" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="0.5 12" opacity="0.55"/>

  <!-- route line (the journey / "S" shaped journey) -->
  <path d="M 56 148 C 56 110, 90 122, 100 100 C 110 78, 96 66, 118 56"
        fill="none" stroke="url(#path)" stroke-width="7" stroke-linecap="round"/>

  <!-- origin dot -->
  <circle cx="56" cy="148" r="6.5" fill="#fbf9f4"/>

  <!-- destination pin -->
  <g>
    <path d="M118 30 C 132.6 30 144 41.6 144 56 C 144 75 118 96 118 96 C 118 96 92 75 92 56 C 92 41.6 103.4 30 118 30 Z"
          fill="#fbf9f4"/>
    <circle cx="118" cy="56" r="12" fill="#ff6a2b"/>
  </g>
</svg>
